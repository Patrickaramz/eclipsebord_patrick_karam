services:
  backend:
    build:
      context: .
      dockerfile: dockerfiles/backend.dockerfile
    image: eclipsebordacrpatrick.azurecr.io/eclipsebord-backend:latest
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: dockerfiles/frontend.dockerfile
    image: eclipsebordacrpatrick.azurecr.io/eclipsebord-frontend:latest
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000